<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <h1>Masuk</h1>
      <p>Halaman ini untuk mengakses Dashboard Admin dan Panel Operator. Layar Kiosk tidak memerlukan login.</p>

      <div id="already-logged-in" class="already-logged-in" hidden>
        <p>
          Sudah login sebagai <strong id="logged-in-name"></strong>
          (<span id="logged-in-role"></span>).
        </p>
        <button type="button" id="continue-btn">Lanjutkan</button>
        <button type="button" id="logout-btn">Logout</button>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" id="toggle-password" aria-label="Tampilkan password" aria-controls="password" aria-pressed="false">
              <svg class="password-eye-open" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="password-eye-closed" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="m3 3 18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3 3.8"></path>
                <path d="M6.2 6.2A16.3 16.3 0 0 0 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"></path>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="login-submit">Masuk</button>
        <p id="login-error" class="error-message" hidden></p>
      </form>

      <p class="login-hint">
        Gunakan akun uji dari <a href="https://dummyjson.com/users" target="_blank" rel="noopener">dummyjson.com/users</a>
        (contoh username/password tercantum di sana).
      </p>
    </div>
  </main>

  <script type="module" src="dist/login.js" defer></script>
</body>
</html>
